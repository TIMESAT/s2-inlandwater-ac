[metadata]
name = s2-inlandwater-ac
version = 0.1.0
description = Unified command-line runner for Sentinel-2 inland-water atmospheric correction processors
long_description = file: README.md
long_description_content_type = text/markdown

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
include_package_data = True

[options.packages.find]
where = src

[options.entry_points]
console_scripts =
    s2-water-ac = s2_water_ac.cli:main
